<svg viewBox="0 0 340 214" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="platbg" x1="0" y1="0" x2="340" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="40%" stop-color="#efefef"/>
      <stop offset="100%" stop-color="#a9a9a9"/>
    </linearGradient>
    <linearGradient id="pchip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect width="340" height="214" rx="12" fill="url(#platbg)"/>
  <rect x="1" y="1" width="338" height="212" rx="11" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <!-- Subtle shine -->
  <ellipse cx="280" cy="40" rx="100" ry="60" fill="rgba(255,255,255,0.15)"/>
  <!-- Chip -->
  <rect x="32" y="72" width="46" height="34" rx="5" fill="url(#pchip)"/>
  <line x1="32" y1="82" x2="78" y2="82" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <line x1="32" y1="90" x2="78" y2="90" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <line x1="32" y1="98" x2="78" y2="98" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <line x1="55" y1="72" x2="55" y2="106" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <!-- Card title -->
  <text x="32" y="46" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="rgba(0,0,0,0.35)">PLATINUM</text>
  <!-- Abstract V/wave logo -->
  <g transform="translate(260, 20)">
    <path d="M10 40 L30 5 L40 5 L22 40 Z" fill="rgba(30,58,95,0.15)"/>
    <path d="M30 40 L50 5 L60 5 L42 40 Z" fill="rgba(30,58,95,0.1)"/>
  </g>
  <!-- Card number dots -->
  <text x="32" y="140" font-family="'Inter', monospace" font-size="16" letter-spacing="2" fill="rgba(0,0,0,0.25)">••••  ••••  ••••  ••••</text>
  <!-- Cardholder -->
  <text x="32" y="170" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="rgba(0,0,0,0.2)">CARD MEMBER</text>
  <!-- Bank name -->
  <text x="32" y="196" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="rgba(30,58,95,0.3)">SIGNATURE</text>
</svg>
