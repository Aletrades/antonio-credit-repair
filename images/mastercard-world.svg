<svg viewBox="0 0 340 214" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mcbg" x1="0" y1="0" x2="340" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="mcchip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8922e"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect width="340" height="214" rx="12" fill="url(#mcbg)"/>
  <rect x="1" y="1" width="338" height="212" rx="11" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Subtle glow -->
  <ellipse cx="100" cy="180" rx="150" ry="80" fill="rgba(30,60,120,0.15)"/>
  <!-- Chip -->
  <rect x="32" y="72" width="46" height="34" rx="5" fill="url(#mcchip)"/>
  <line x1="32" y1="82" x2="78" y2="82" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  <line x1="32" y1="90" x2="78" y2="90" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  <line x1="32" y1="98" x2="78" y2="98" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  <line x1="55" y1="72" x2="55" y2="106" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  <!-- Overlapping circles (generic Venn) -->
  <circle cx="265" cy="42" r="22" fill="#eb001b" opacity="0.8"/>
  <circle cx="295" cy="42" r="22" fill="#f79e1b" opacity="0.8"/>
  <ellipse cx="280" cy="42" rx="7" ry="18" fill="#ff5f00" opacity="0.9"/>
  <!-- Card number dots -->
  <text x="32" y="140" font-family="'Inter', monospace" font-size="16" letter-spacing="2" fill="rgba(255,255,255,0.4)">••••  ••••  ••••  ••••</text>
  <!-- Cardholder -->
  <text x="32" y="170" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="rgba(255,255,255,0.3)">CARD MEMBER</text>
  <!-- World Elite -->
  <text x="32" y="196" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" letter-spacing="4" fill="rgba(255,255,255,0.4)">WORLD ELITE</text>
</svg>
